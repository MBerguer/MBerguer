<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <!-- Cyan Neon Glow Filter -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Red Neon Glow Filter -->
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Car Drop Shadow -->
    <filter id="car-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Asphalt Grain Pattern -->
    <pattern id="asphalt-grain" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#0d1119" />
      <circle cx="10" cy="10" r="1.5" fill="#1b2333" opacity="0.7" />
      <circle cx="35" cy="18" r="1.2" fill="#151c2a" opacity="0.8" />
      <circle cx="20" cy="38" r="1.6" fill="#06090e" opacity="0.9" />
      <circle cx="42" cy="36" r="1.1" fill="#253046" opacity="0.5" />
    </pattern>

    <!-- Volumetric Headlight Beams -->
    <linearGradient id="beam-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beam-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb800" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#ffb800" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffb800" stop-opacity="0" />
    </linearGradient>

    <!-- Carbon Fiber Monocoque Gradient -->
    <linearGradient id="carbon-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- ========================================================
         MATHEMATICAL RACING LINES (100% C1 CONTINUOUS SMOOTH SPLINES)
         Built with reflected Bezier 'S' anchors for zero angular kinks
         Direction: Left to Right (-120px to 980px)
         ======================================================== -->
    
    <!-- Path 1: Optimal Outside-Inside-Outside Apex (Tincho #1) -->
    <path id="path-lead" d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" />

    <!-- Path 2: Inside Aggressive Battle Line (Rival Red #7 - Parallel, zero collision) -->
    <path id="path-inside" d="M -120,195 C 60,155 180,115 310,115 S 470,205 550,205 S 760,145 980,135" fill="none" />

    <!-- Path 3: Tow / High Slipstream Line (Pursuer Purple #24) -->
    <path id="path-chase" d="M -120,135 C 60,95 180,55 330,55 S 490,145 570,145 S 760,85 980,75" fill="none" />

    <!-- ========================================================
         CAR GRAPHIC COMPONENTS (HEADING RIGHT = TANGENT TO PATH)
         ======================================================== -->

    <!-- CAR 1: TINCHO BERGUER (#1 CYAN & OBSIDIAN) -->
    <g id="car-tincho" filter="url(#car-shadow)">
      <polygon points="18,-7 140,-38 152,-10 18,-2" fill="url(#beam-cyan)" />
      <polygon points="18,7 140,38 152,10 18,2" fill="url(#beam-cyan)" />

      <!-- Front Wing with Endplates -->
      <rect x="18" y="-18" width="4" height="36" rx="1.5" fill="#00f0ff" filter="url(#glow-cyan)" />
      <rect x="15" y="-20" width="8" height="3" fill="#e10600" />
      <rect x="15" y="17" width="8" height="3" fill="#e10600" />

      <!-- Suspension Wishbones -->
      <line x1="6" y1="-6" x2="13" y2="-15" stroke="#64748b" stroke-width="1.8" />
      <line x1="12" y1="-6" x2="14" y2="-15" stroke="#64748b" stroke-width="1.8" />
      <line x1="6" y1="6" x2="13" y2="15" stroke="#64748b" stroke-width="1.8" />
      <line x1="12" y1="6" x2="14" y2="15" stroke="#64748b" stroke-width="1.8" />
      <line x1="-10" y1="-8" x2="-15" y2="-17" stroke="#64748b" stroke-width="1.8" />
      <line x1="-10" y1="8" x2="-15" y2="17" stroke="#64748b" stroke-width="1.8" />

      <!-- 4 Wide Slick Tires with Yellow Sidewall -->
      <rect x="7" y="-20" width="12" height="7" rx="2" fill="#06090e" stroke="#ffb800" stroke-width="0.9" />
      <rect x="7" y="13" width="12" height="7" rx="2" fill="#06090e" stroke="#ffb800" stroke-width="0.9" />
      <rect x="-22" y="-22" width="14" height="8.5" rx="2" fill="#06090e" stroke="#ffb800" stroke-width="1" />
      <rect x="-22" y="13.5" width="14" height="8.5" rx="2" fill="#06090e" stroke="#ffb800" stroke-width="1" />

      <!-- Monocoque Chassis -->
      <path d="M 22,0 L 7,-7 L -12,-13 L -24,-11 L -24,11 L -12,13 L 7,7 Z" fill="url(#carbon-skin)" stroke="#00f0ff" stroke-width="1.2" />

      <!-- Sidepods -->
      <path d="M 5,-10 L -10,-15 L -18,-12 L -18,-7 Z" fill="#00f0ff" opacity="0.9" />
      <path d="M 5,10 L -10,15 L -18,12 L -18,7 Z" fill="#00f0ff" opacity="0.9" />

      <!-- Rear Wing -->
      <rect x="-29" y="-18" width="5.5" height="36" rx="1.5" fill="#00f0ff" filter="url(#glow-cyan)" />
      <rect x="-31" y="-20" width="9" height="3" fill="#e10600" />
      <rect x="-31" y="17" width="9" height="3" fill="#e10600" />
      <circle cx="-29" cy="0" r="1.8" fill="#ff0044" filter="url(#glow-red)" />

      <!-- Cockpit & Driver Helmet -->
      <ellipse cx="-1" cy="0" rx="8" ry="5.5" fill="#020617" />
      <circle cx="-2" cy="0" r="4.8" fill="#f8fafc" />
      <rect x="-1" y="-3.2" width="3.5" height="6.4" rx="1.2" fill="#ffb800" />

      <!-- Race #1 -->
      <circle cx="9" cy="0" r="3.2" fill="#ffffff" />
      <text x="9" y="2.2" font-family="'JetBrains Mono', monospace" font-size="4.8" font-weight="900" text-anchor="middle" fill="#000">1</text>
    </g>

    <!-- CAR 2: RIVAL CHALLENGER (#7 ROSSO CORSA RED) -->
    <g id="car-red" filter="url(#car-shadow)">
      <polygon points="18,-7 135,-36 148,-10 18,-2" fill="url(#beam-amber)" />
      <polygon points="18,7 135,36 148,10 18,2" fill="url(#beam-amber)" />

      <rect x="18" y="-18" width="4" height="36" rx="1.5" fill="#e10600" filter="url(#glow-red)" />
      <rect x="7" y="-20" width="12" height="7" rx="2" fill="#06090e" stroke="#ffffff" stroke-width="0.9" />
      <rect x="7" y="13" width="12" height="7" rx="2" fill="#06090e" stroke="#ffffff" stroke-width="0.9" />
      <rect x="-22" y="-22" width="14" height="8.5" rx="2" fill="#06090e" stroke="#ffffff" stroke-width="1" />
      <rect x="-22" y="13.5" width="14" height="8.5" rx="2" fill="#06090e" stroke="#ffffff" stroke-width="1" />

      <path d="M 22,0 L 7,-7 L -12,-13 L -24,-11 L -24,11 L -12,13 L 7,7 Z" fill="#e10600" stroke="#ffffff" stroke-width="1" />
      <rect x="-16" y="-2.5" width="26" height="1.8" fill="#ffffff" />
      <rect x="-16" y="0.7" width="26" height="1.8" fill="#ffffff" />

      <rect x="-29" y="-18" width="5.5" height="36" rx="1.5" fill="#e10600" />
      <circle cx="-1" cy="0" rx="8" ry="5.5" fill="#020617" />
      <circle cx="-2" cy="0" r="4.8" fill="#e10600" />
      <rect x="-1" y="-3.2" width="3.5" height="6.4" rx="1.2" fill="#020617" />

      <!-- Race #7 -->
      <circle cx="9" cy="0" r="3.2" fill="#ffffff" />
      <text x="9" y="2.2" font-family="'JetBrains Mono', monospace" font-size="4.8" font-weight="900" text-anchor="middle" fill="#e10600">7</text>
    </g>

    <!-- CAR 3: PURSUER (#24 PURPLE & NEON EMERALD) -->
    <g id="car-purple" filter="url(#car-shadow)">
      <polygon points="18,-7 130,-34 142,-10 18,-2" fill="url(#beam-cyan)" opacity="0.75" />
      <polygon points="18,7 130,34 142,10 18,2" fill="url(#beam-cyan)" opacity="0.75" />

      <rect x="18" y="-18" width="4" height="36" rx="1.5" fill="#a855f7" />
      <rect x="7" y="-20" width="12" height="7" rx="2" fill="#06090e" stroke="#10b981" stroke-width="0.9" />
      <rect x="7" y="13" width="12" height="7" rx="2" fill="#06090e" stroke="#10b981" stroke-width="0.9" />
      <rect x="-22" y="-22" width="14" height="8.5" rx="2" fill="#06090e" stroke="#10b981" stroke-width="1" />
      <rect x="-22" y="13.5" width="14" height="8.5" rx="2" fill="#06090e" stroke="#10b981" stroke-width="1" />

      <path d="M 22,0 L 7,-7 L -12,-13 L -24,-11 L -24,11 L -12,13 L 7,7 Z" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
      <rect x="-16" y="-1" width="26" height="2" fill="#10b981" />

      <rect x="-29" y="-18" width="5.5" height="36" rx="1.5" fill="#a855f7" />
      <circle cx="-1" cy="0" rx="8" ry="5.5" fill="#020617" />
      <circle cx="-2" cy="0" r="4.8" fill="#10b981" />
      <rect x="-1" y="-3.2" width="3.5" height="6.4" rx="1.2" fill="#00f0ff" />

      <!-- Race #24 -->
      <circle cx="9" cy="0" r="3.2" fill="#10b981" />
      <text x="9" y="2.2" font-family="'JetBrains Mono', monospace" font-size="4.5" font-weight="900" text-anchor="middle" fill="#000">24</text>
    </g>

    <!-- CSS STYLES FOR SYNCHRONIZED LIGHTS & TELEMETRY -->
    <style>
      /* 6.2s Master Cycle:
         0.0s to 2.7s (0% to 44%): Yellow Flag / Controlled Entry / Progressive Braking
         2.7s to 6.2s (44% to 100%): Green Flag / Acceleration / Full Throttle
      */
      @keyframes fiaGantryCycle {
        0%, 43.9% { fill: #ffb800; filter: drop-shadow(0 0 10px #ffb800); }
        44%, 100% { fill: #10b981; filter: drop-shadow(0 0 12px #10b981); }
      }

      @keyframes fiaLabelCycle {
        0%, 43.9% { fill: #ffb800; }
        44%, 100% { fill: #10b981; }
      }

      @keyframes rpmBarPulse {
        0% { width: 140px; }
        44% { width: 80px; }
        85% { width: 186px; }
        100% { width: 140px; }
      }

      @keyframes coinBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      .fia-active-led {
        animation: fiaGantryCycle 6.2s infinite steps(1);
      }
      .fia-active-text {
        animation: fiaLabelCycle 6.2s infinite steps(1);
      }
      .rpm-meter-bar {
        animation: rpmBarPulse 6.2s infinite ease-in-out;
      }
      .cta-button-blink {
        animation: coinBlink 1.4s infinite ease-in-out;
      }
      .mono-code {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
    </style>
  </defs>

  <!-- PADDOCK BACKGROUND WITH GRID -->
  <rect width="850" height="280" rx="10" fill="#07090e" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5" />

  <!-- TECH MATRIX GRID -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="56" x2="850" y2="56" />
    <line x1="0" y1="112" x2="850" y2="112" />
    <line x1="0" y1="168" x2="850" y2="168" />
    <line x1="0" y1="224" x2="850" y2="224" />
    <line x1="170" y1="0" x2="170" y2="280" />
    <line x1="340" y1="0" x2="340" y2="280" />
    <line x1="510" y1="0" x2="510" y2="280" />
    <line x1="680" y1="0" x2="680" y2="280" />
  </g>

  <!-- ========================================================
       REALISTIC HIGH-SPEED ASPHALT TRACK WITH 3D CURBS
       ======================================================== -->
  <!-- Outer Run-off & Foundation -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#161c2a" stroke-width="132" stroke-linecap="round" />

  <!-- 3D FIA Rumble Kerbs (Alternating Red & White Teeth) -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#e10600" stroke-width="118" stroke-dasharray="16 16" stroke-linecap="round" />
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#ffffff" stroke-width="118" stroke-dasharray="0 16 16 0" stroke-linecap="round" />

  <!-- Main Asphalt Surface with Grain -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="url(#asphalt-grain)" stroke-width="102" stroke-linecap="round" />

  <!-- Burned Rubber Racing Line (Permanent Groove) -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#040609" stroke-width="50" opacity="0.65" stroke-linecap="round" />

  <!-- Permanent Apex Skid Marks from High Lateral G-Force -->
  <g stroke="#030407" stroke-width="4.5" opacity="0.75">
    <path d="M 240,90 C 280,85 310,85 350,92" fill="none" />
    <path d="M 243,98 C 283,93 313,93 353,100" fill="none" />
    <path d="M 480,168 C 520,178 550,178 590,168" fill="none" />
    <path d="M 484,176 C 524,186 554,186 594,176" fill="none" />
  </g>

  <!-- Fluorescent Guide Line -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="rgba(0, 240, 255, 0.22)" stroke-width="2.5" stroke-dasharray="14 20" />

  <!-- ========================================================
       FIA TRACKSIDE LIGHT GANTRY (INTERACTIVE SEMAPHORE)
       Positioned at the chicane apex (x: 370)
       ======================================================== -->
  <g transform="translate(370, 42)">
    <!-- Heavy Gantry Bridge Post -->
    <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- 3 High-Power FIA Signal LEDs -->
    <circle cx="-30" cy="0" r="7" class="fia-active-led" />
    <circle cx="0" cy="0" r="7" class="fia-active-led" />
    <circle cx="30" cy="0" r="7" class="fia-active-led" />
    
    <!-- Dynamic Gantry Status Label -->
    <text x="0" y="28" font-size="9" text-anchor="middle" class="mono-code fia-active-text" font-weight="800" letter-spacing="1">
      FIA 3504-2019 GANTRY
    </text>
  </g>

  <!-- ========================================================
       THE 3 CARS: SYNCHRONIZED RACING PACK WITH C1 VELOCITY CONTINUITY
       - Zero jumps: C1 continuous cubic Bezier velocity splines
       - Progressive braking into Turn 1, smooth roll-on throttle out
       - Real tight pack racing offset (-0.35s and -0.70s)
       ======================================================== -->

  <!-- CAR 3: PURSUER (#24 PURPLE & EMERALD) - HIGH LINE (In the tow) -->
  <g>
    <animateMotion
      dur="6.2s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="spline"
      keyTimes="0; 0.44; 1"
      keySplines="0.33 0.15 0.67 0.85; 0.33 0.15 0.67 0.85"
      begin="-0.70s">
      <mpath xlink:href="#path-chase" href="#path-chase" />
    </animateMotion>
    <use xlink:href="#car-purple" href="#car-purple" />
  </g>

  <!-- CAR 2: RIVAL (#7 ROSSO CORSA) - INSIDE OVERTAKE LINE -->
  <g>
    <animateMotion
      dur="6.2s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="spline"
      keyTimes="0; 0.44; 1"
      keySplines="0.33 0.15 0.67 0.85; 0.33 0.15 0.67 0.85"
      begin="-0.35s">
      <mpath xlink:href="#path-inside" href="#path-inside" />
    </animateMotion>
    <use xlink:href="#car-red" href="#car-red" />
  </g>

  <!-- CAR 1: TINCHO BERGUER (#1 CYAN & CARBON) - RACE LEADER -->
  <g>
    <animateMotion
      dur="6.2s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="spline"
      keyTimes="0; 0.44; 1"
      keySplines="0.33 0.15 0.67 0.85; 0.33 0.15 0.67 0.85"
      begin="0s">
      <mpath xlink:href="#path-lead" href="#path-lead" />
    </animateMotion>
    <use xlink:href="#car-tincho" href="#car-tincho" />
  </g>

  <!-- ========================================================
       PIT-WALL COCKPIT TELEMETRY (DYNAMIC HUD)
       ======================================================== -->
  <g transform="translate(24, 20)">
    <rect width="215" height="74" rx="8" fill="rgba(10, 15, 26, 0.94)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.4" />
    
    <text x="14" y="24" fill="#94a3b8" font-size="9" class="mono-code" font-weight="700" letter-spacing="1">
      PIT-WALL // SECTOR 1
    </text>

    <!-- Speedometer -->
    <text x="14" y="55" fill="#ffffff" font-size="32" font-weight="800" class="mono-code" letter-spacing="-1">
      242
    </text>
    <text x="82" y="55" fill="#00f0ff" font-size="12" font-weight="800" class="mono-code">
      KM/H
    </text>

    <!-- Gear Box -->
    <rect x="135" y="32" width="28" height="28" rx="4" fill="#111827" stroke="#ffb800" stroke-width="1.2" />
    <text x="149" y="52" fill="#ffb800" font-size="17" font-weight="800" text-anchor="middle" class="mono-code">6</text>

    <!-- RPM Bar Fill -->
    <rect x="14" y="64" width="186" height="4" rx="2" fill="rgba(255,255,255,0.08)" />
    <rect x="14" y="64" width="95" height="4" rx="2" fill="url(#beam-cyan)" class="rpm-meter-bar" />
  </g>

  <!-- INTERACTIVE PLAYABLE CTA (BOTTOM RIGHT) -->
  <g transform="translate(565, 214)" class="cta-button-blink" style="cursor: pointer;">
    <rect width="260" height="46" rx="6" fill="#e10600" filter="url(#glow-red)" />
    <text x="130" y="28" fill="#ffffff" font-size="11.5" text-anchor="middle" class="mono-code" font-weight="800" letter-spacing="1.5">
      ▶ TAKE THE WHEEL &amp; RACE (LIVE)
    </text>
  </g>

  <!-- PADDOCK FOOTER TAG -->
  <text x="24" y="260" fill="#64748b" font-size="10.5" class="mono-code" font-weight="600">
    TINCHO GP // FIA TRACK TELEMETRY &amp; LOW-LATENCY RUST CONCURRENCY
  </text>
</svg>
