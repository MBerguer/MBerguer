<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <!-- 16-BIT CRT SCANLINE OVERLAY -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35" />
    </pattern>

    <!-- 16-BIT DITHERED ASPHALT TEXTURE (2x2 CHECKERBOARD DITHER) -->
    <pattern id="pixel-asphalt" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#121722" />
      <rect x="0" y="0" width="2" height="2" fill="#0d111a" />
      <rect x="4" y="2" width="2" height="2" fill="#1a2232" />
      <rect x="2" y="4" width="2" height="2" fill="#0d111a" />
      <rect x="6" y="6" width="2" height="2" fill="#1a2232" />
    </pattern>

    <!-- 16-BIT GRAVEL RUN-OFF DITHER -->
    <pattern id="pixel-gravel" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#1c2436" />
      <rect x="0" y="0" width="2" height="2" fill="#29354d" />
      <rect x="3" y="3" width="2" height="2" fill="#141a26" />
    </pattern>

    <!-- PIXEL HEADLIGHT CONE (STEPPED 16-BIT DITHER) -->
    <linearGradient id="pixel-beam-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pixel-beam-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb800" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ffb800" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#ffb800" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffb800" stop-opacity="0" />
    </linearGradient>

    <!-- ========================================================
         MATHEMATICAL RACING LINES (100% C1 CONTINUOUS SMOOTH SPLINES)
         Direction: Left to Right (-120px to 980px)
         ======================================================== -->
    <path id="path-lead" d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" />
    <path id="path-inside" d="M -120,195 C 60,155 180,115 310,115 S 470,205 550,205 S 760,145 980,135" fill="none" />
    <path id="path-chase" d="M -120,135 C 60,95 180,55 330,55 S 490,145 570,145 S 760,85 980,75" fill="none" />

    <!-- ========================================================
         AUTHENTIC 16-BIT PIXEL ART RACE CARS (46x22 PIXELS)
         Drawn with shape-rendering="crispEdges" on strict pixel grid
         ======================================================== -->

    <!-- CAR 1: LEAD MONOPLAZA (#1 CYAN & OBSIDIAN) -->
    <g id="car-tincho" shape-rendering="crispEdges">
      <!-- Headlight Beams -->
      <polygon points="18,-7 140,-38 152,-10 18,-2" fill="url(#pixel-beam-cyan)" opacity="0.9" />
      <polygon points="18,7 140,38 152,10 18,2" fill="url(#pixel-beam-cyan)" opacity="0.9" />

      <!-- Pixel Shadow -->
      <rect x="-26" y="-12" width="50" height="26" fill="#000000" opacity="0.55" />

      <!-- 4 Wide 16-Bit Slick Tires -->
      <!-- Front Tires -->
      <rect x="8" y="-20" width="12" height="7" fill="#05070a" />
      <rect x="9" y="-19" width="10" height="5" fill="#151b26" />
      <rect x="8" y="-17" width="12" height="1" fill="#ffb800" /> <!-- Yellow Pirelli line -->

      <rect x="8" y="13" width="12" height="7" fill="#05070a" />
      <rect x="9" y="14" width="10" height="5" fill="#151b26" />
      <rect x="8" y="16" width="12" height="1" fill="#ffb800" />

      <!-- Rear Tires (Wider) -->
      <rect x="-24" y="-22" width="14" height="9" fill="#05070a" />
      <rect x="-23" y="-21" width="12" height="7" fill="#151b26" />
      <rect x="-24" y="-18" width="14" height="1" fill="#ffb800" />

      <rect x="-24" y="13" width="14" height="9" fill="#05070a" />
      <rect x="-23" y="14" width="12" height="7" fill="#151b26" />
      <rect x="-24" y="17" width="14" height="1" fill="#ffb800" />

      <!-- Suspension Wishbone Struts (Pixel Lines) -->
      <rect x="6" y="-13" width="8" height="2" fill="#64748b" />
      <rect x="6" y="11" width="8" height="2" fill="#64748b" />
      <rect x="-14" y="-14" width="8" height="2" fill="#64748b" />
      <rect x="-14" y="12" width="8" height="2" fill="#64748b" />

      <!-- Front Wing (Stepped Pixel Wing) -->
      <rect x="18" y="-18" width="4" height="36" fill="#00f0ff" />
      <rect x="16" y="-19" width="8" height="3" fill="#e10600" />
      <rect x="16" y="16" width="8" height="3" fill="#e10600" />
      <rect x="20" y="-16" width="2" height="32" fill="#ffffff" /> <!-- Wing Highlight -->

      <!-- Main Monocoque Chassis -->
      <rect x="-24" y="-10" width="42" height="20" fill="#080c14" />
      <rect x="-20" y="-8" width="38" height="16" fill="#0f172a" />
      
      <!-- Cyan Livery Stripes & Sidepods -->
      <rect x="-16" y="-12" width="24" height="4" fill="#00f0ff" />
      <rect x="-16" y="8" width="24" height="4" fill="#00f0ff" />
      <rect x="-12" y="-10" width="18" height="2" fill="#38bdf8" />
      <rect x="-12" y="8" width="18" height="2" fill="#38bdf8" />

      <!-- Aerodynamic Tapered Nose -->
      <rect x="16" y="-5" width="6" height="10" fill="#00f0ff" />
      <rect x="22" y="-3" width="4" height="6" fill="#00f0ff" />
      <rect x="24" y="-1" width="2" height="2" fill="#ffffff" />

      <!-- Cockpit & Halo Ring -->
      <rect x="-4" y="-5" width="10" height="10" fill="#030508" />
      <rect x="-2" y="-6" width="6" height="1" fill="#00f0ff" />
      <rect x="-2" y="5" width="6" height="1" fill="#00f0ff" />

      <!-- Driver Helmet (White with Gold Visor) -->
      <rect x="-2" y="-3" width="6" height="6" fill="#f8fafc" />
      <rect x="1" y="-2" width="3" height="4" fill="#ffb800" />

      <!-- Rear Wing with DRS Flap & FIA Rain LED -->
      <rect x="-29" y="-18" width="5" height="36" fill="#00f0ff" />
      <rect x="-31" y="-19" width="8" height="3" fill="#e10600" />
      <rect x="-31" y="16" width="8" height="3" fill="#e10600" />
      <rect x="-29" y="-1" width="3" height="2" fill="#ff0044" /> <!-- Flashing Rain LED -->

      <!-- Car #1 Pixel Decal -->
      <rect x="9" y="-2" width="4" height="4" fill="#ffffff" />
      <rect x="10" y="-1" width="2" height="2" fill="#000000" />
    </g>

    <!-- CAR 2: RIVAL (#7 ROSSO CORSA RED) -->
    <g id="car-red" shape-rendering="crispEdges">
      <polygon points="18,-7 135,-36 148,-10 18,-2" fill="url(#pixel-beam-amber)" opacity="0.8" />
      <polygon points="18,7 135,36 148,10 18,2" fill="url(#pixel-beam-amber)" opacity="0.8" />

      <rect x="-26" y="-12" width="50" height="26" fill="#000000" opacity="0.5" />

      <!-- Tires -->
      <rect x="8" y="-20" width="12" height="7" fill="#05070a" />
      <rect x="8" y="-17" width="12" height="1" fill="#ffffff" />
      <rect x="8" y="13" width="12" height="7" fill="#05070a" />
      <rect x="8" y="16" width="12" height="1" fill="#ffffff" />
      <rect x="-24" y="-22" width="14" height="9" fill="#05070a" />
      <rect x="-24" y="-18" width="14" height="1" fill="#ffffff" />
      <rect x="-24" y="13" width="14" height="9" fill="#05070a" />
      <rect x="-24" y="17" width="14" height="1" fill="#ffffff" />

      <!-- Suspension -->
      <rect x="6" y="-13" width="8" height="2" fill="#64748b" />
      <rect x="6" y="11" width="8" height="2" fill="#64748b" />
      <rect x="-14" y="-14" width="8" height="2" fill="#64748b" />
      <rect x="-14" y="12" width="8" height="2" fill="#64748b" />

      <!-- Front Wing -->
      <rect x="18" y="-18" width="4" height="36" fill="#e10600" />
      <rect x="16" y="-19" width="8" height="3" fill="#ffffff" />
      <rect x="16" y="16" width="8" height="3" fill="#ffffff" />

      <!-- Body -->
      <rect x="-24" y="-10" width="42" height="20" fill="#990000" />
      <rect x="-20" y="-8" width="38" height="16" fill="#e10600" />
      <rect x="-18" y="-2" width="30" height="1" fill="#ffffff" />
      <rect x="-18" y="1" width="30" height="1" fill="#ffffff" />

      <rect x="16" y="-5" width="6" height="10" fill="#e10600" />
      <rect x="22" y="-3" width="4" height="6" fill="#e10600" />

      <!-- Cockpit & Helmet -->
      <rect x="-4" y="-5" width="10" height="10" fill="#030508" />
      <rect x="-2" y="-3" width="6" height="6" fill="#e10600" />
      <rect x="1" y="-2" width="3" height="4" fill="#05070a" />

      <rect x="-29" y="-18" width="5" height="36" fill="#e10600" />
      <rect x="-29" y="-1" width="3" height="2" fill="#ff0044" />

      <rect x="9" y="-2" width="4" height="4" fill="#ffffff" />
      <rect x="10" y="-1" width="2" height="2" fill="#e10600" />
    </g>

    <!-- CAR 3: PURSUER (#24 PURPLE & NEON EMERALD) -->
    <g id="car-purple" shape-rendering="crispEdges">
      <polygon points="18,-7 130,-34 142,-10 18,-2" fill="url(#pixel-beam-cyan)" opacity="0.75" />
      <polygon points="18,7 130,34 142,10 18,2" fill="url(#pixel-beam-cyan)" opacity="0.75" />

      <rect x="-26" y="-12" width="50" height="26" fill="#000000" opacity="0.45" />

      <!-- Tires -->
      <rect x="8" y="-20" width="12" height="7" fill="#05070a" />
      <rect x="8" y="-17" width="12" height="1" fill="#10b981" />
      <rect x="8" y="13" width="12" height="7" fill="#05070a" />
      <rect x="8" y="16" width="12" height="1" fill="#10b981" />
      <rect x="-24" y="-22" width="14" height="9" fill="#05070a" />
      <rect x="-24" y="-18" width="14" height="1" fill="#10b981" />
      <rect x="-24" y="13" width="14" height="9" fill="#05070a" />
      <rect x="-24" y="17" width="14" height="1" fill="#10b981" />

      <rect x="18" y="-18" width="4" height="36" fill="#a855f7" />
      <rect x="-24" y="-10" width="42" height="20" fill="#3b0764" />
      <rect x="-20" y="-8" width="38" height="16" fill="#7e22ce" />
      <rect x="-16" y="-1" width="26" height="2" fill="#10b981" />

      <rect x="16" y="-5" width="6" height="10" fill="#a855f7" />
      <rect x="-4" y="-5" width="10" height="10" fill="#030508" />
      <rect x="-2" y="-3" width="6" height="6" fill="#10b981" />
      <rect x="1" y="-2" width="3" height="4" fill="#00f0ff" />

      <rect x="-29" y="-18" width="5" height="36" fill="#a855f7" />
      <rect x="-29" y="-1" width="3" height="2" fill="#ff0044" />

      <rect x="9" y="-2" width="4" height="4" fill="#10b981" />
      <rect x="10" y="-1" width="2" height="2" fill="#000000" />
    </g>

    <!-- 16-BIT RETRO TIMING & LED KEYFRAMES -->
    <style>
      /* 4.2s Master Cycle:
         0.0s to 1.76s (0% to 42%): Yellow Caution & Progressive Braking
         1.76s to 4.2s (42% to 100%): GREEN FLAG POWER LAUNCH (Explosive exit acceleration)
      */
      @keyframes fiaGantry16Bit {
        0%, 41.9% { fill: #ffb800; filter: drop-shadow(0 0 8px #ffb800); }
        42%, 100% { fill: #10b981; filter: drop-shadow(0 0 10px #10b981); }
      }

      @keyframes fiaText16Bit {
        0%, 41.9% { fill: #ffb800; }
        42%, 100% { fill: #10b981; }
      }

      /* Segmented 16-bit LED Tachometer */
      @keyframes ledSegmentTacho {
        0% { width: 110px; }
        42% { width: 60px; }   /* Apex downshift */
        80% { width: 176px; }  /* Full redline on exit */
        100% { width: 176px; }
      }

      @keyframes insertCoinPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .fia-led-square {
        animation: fiaGantry16Bit 4.2s infinite steps(1);
      }
      .fia-label-retro {
        animation: fiaText16Bit 4.2s infinite steps(1);
      }
      .led-tacho-fill {
        animation: ledSegmentTacho 4.2s infinite steps(16);
      }
      .pixel-insert-coin {
        animation: insertCoinPulse 1.2s infinite steps(1);
      }
      .retro-mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- RETRO CRT CABINET BEZEL -->
  <rect width="850" height="280" rx="8" fill="#06090e" stroke="#1f2937" stroke-width="2" />

  <!-- ========================================================
       16-BIT PIXEL ASPHALT CIRCUIT WITH STEPPED CHUNKY KERBS
       ======================================================== -->
  <!-- Gravel Bed Base -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="url(#pixel-gravel)" stroke-width="134" stroke-linecap="square" />

  <!-- 16-Bit Pixelated Kerbs (Alternating Chunky Blocks) -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#e10600" stroke-width="120" stroke-dasharray="16 16" stroke-linecap="square" />
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#f8fafc" stroke-width="120" stroke-dasharray="0 16 16 0" stroke-linecap="square" />

  <!-- Dithered Racing Asphalt -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="url(#pixel-asphalt)" stroke-width="104" stroke-linecap="square" />

  <!-- Rubbered Groove Line -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#05080e" stroke-width="52" opacity="0.75" stroke-linecap="square" />

  <!-- Pixel Apex Tire Skid Marks -->
  <g fill="#020305" shape-rendering="crispEdges">
    <rect x="250" y="88" width="12" height="3" />
    <rect x="264" y="86" width="14" height="3" />
    <rect x="280" y="84" width="16" height="3" />
    <rect x="298" y="83" width="18" height="3" />
    <rect x="318" y="84" width="20" height="3" />
    <rect x="340" y="86" width="16" height="3" />

    <rect x="490" y="166" width="14" height="3" />
    <rect x="506" y="172" width="18" height="3" />
    <rect x="526" y="176" width="20" height="3" />
    <rect x="548" y="177" width="18" height="3" />
    <rect x="568" y="174" width="16" height="3" />
  </g>

  <!-- Fluorescent Guide Dashes -->
  <path d="M -120,165 C 60,125 180,85 320,85 S 480,175 560,175 S 760,115 980,105" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 16" opacity="0.35" />

  <!-- ========================================================
       16-BIT RETRO FIA TRACKSIDE LIGHT GANTRY
       ======================================================== -->
  <g transform="translate(370, 38)" shape-rendering="crispEdges">
    <!-- Steel Truss Post -->
    <rect x="-50" y="-12" width="100" height="24" fill="#090d16" stroke="#374151" stroke-width="1.5" />
    
    <!-- 3 Discrete 16-Bit Square LEDs -->
    <rect x="-34" y="-6" width="12" height="12" class="fia-led-square" />
    <rect x="-6" y="-6" width="12" height="12" class="fia-led-square" />
    <rect x="22" y="-6" width="12" height="12" class="fia-led-square" />

    <!-- Label -->
    <text x="0" y="24" font-size="8.5" text-anchor="middle" class="retro-mono fia-label-retro" font-weight="800" letter-spacing="1">
      FIA 3504-2019 GANTRY
    </text>
  </g>

  <!-- ========================================================
       THE 3 CARS: CONTINUOUS FORWARD LOOP WITH C1 PROGRESSIVE ACCELERATION
       ======================================================== -->

  <!-- CAR 3: PURSUER (#24 PURPLE & EMERALD) - HIGH LINE -->
  <g>
    <animateMotion
      dur="4.2s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="spline"
      keyTimes="0; 0.42; 1"
      keySplines="0.35 0.15 0.65 0.90; 0.35 0.10 0.20 1.00"
      begin="-0.48s">
      <mpath xlink:href="#path-chase" href="#path-chase" />
    </animateMotion>
    <use xlink:href="#car-purple" href="#car-purple" />
  </g>

  <!-- CAR 2: RIVAL (#7 ROSSO CORSA) - INSIDE OVERTAKE LINE -->
  <g>
    <animateMotion
      dur="4.2s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="spline"
      keyTimes="0; 0.42; 1"
      keySplines="0.35 0.15 0.65 0.90; 0.35 0.10 0.20 1.00"
      begin="-0.24s">
      <mpath xlink:href="#path-inside" href="#path-inside" />
    </animateMotion>
    <use xlink:href="#car-red" href="#car-red" />
  </g>

  <!-- CAR 1: MARTÍN BERGUER (#1 CYAN & OBSIDIAN) - LEADER -->
  <g>
    <animateMotion
      dur="4.2s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="spline"
      keyTimes="0; 0.42; 1"
      keySplines="0.35 0.15 0.65 0.90; 0.35 0.10 0.20 1.00"
      begin="0s">
      <mpath xlink:href="#path-lead" href="#path-lead" />
    </animateMotion>
    <use xlink:href="#car-tincho" href="#car-tincho" />
  </g>

  <!-- ========================================================
       16-BIT RETRO TELEMETRY HUD (SEGMENTED LED BAR)
       ======================================================== -->
  <g transform="translate(20, 18)" shape-rendering="crispEdges">
    <rect width="210" height="74" fill="#080c14" stroke="#00f0ff" stroke-width="1.5" />
    
    <text x="12" y="20" fill="#94a3b8" font-size="8.5" class="retro-mono" font-weight="700" letter-spacing="1">
      PIT-WALL // SECTOR 1
    </text>

    <!-- Chunky 16-Bit Speedometer -->
    <text x="12" y="52" fill="#ffffff" font-size="30" font-weight="900" class="retro-mono" letter-spacing="-1">
      268
    </text>
    <text x="78" y="52" fill="#00f0ff" font-size="11" font-weight="800" class="retro-mono">
      KM/H
    </text>

    <!-- Gear Box -->
    <rect x="135" y="28" width="26" height="26" fill="#111827" stroke="#ffb800" stroke-width="1.5" />
    <text x="148" y="47" fill="#ffb800" font-size="16" font-weight="900" text-anchor="middle" class="retro-mono">6</text>

    <!-- Segmented 16-Bit LED Bar (16 Segments) -->
    <rect x="12" y="62" width="186" height="5" fill="#1e293b" />
    <g class="led-tacho-fill">
      <rect x="12" y="62" width="100" height="5" fill="#00f0ff" />
    </g>
  </g>

  <!-- 16-BIT ARCADE INSERT COIN / PLAY BUTTON -->
  <g transform="translate(565, 214)" class="pixel-insert-coin" style="cursor: pointer;" shape-rendering="crispEdges">
    <rect width="260" height="46" fill="#e10600" stroke="#ffffff" stroke-width="1.5" />
    <text x="130" y="28" fill="#ffffff" font-size="11" text-anchor="middle" class="retro-mono" font-weight="900" letter-spacing="1.5">
      ▶ INSERT COIN // TAKE WHEEL
    </text>
  </g>

  <!-- PADDOCK FOOTER TAG -->
  <text x="24" y="262" fill="#64748b" font-size="10" class="retro-mono" font-weight="700">
    MARTÍN BERGUER // LOW-LATENCY SYSTEMS &amp; SIMULATION
  </text>

  <!-- CRT SCANLINES TEXTURE ACROSS SCREEN -->
  <rect width="850" height="280" fill="url(#scanlines)" pointer-events="none" />
</svg>
