<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140" shape-rendering="crispEdges">
  <defs>
    <!-- CRT SCANLINE OVERLAY -->
    <pattern id="scanlines-head" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.3" />
    </pattern>

    <style>
      .retro-title {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        fill: #f8fafc;
      }
      .retro-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #00f0ff;
      }
      .retro-meta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- 16-BIT DARK SLATE BEZEL -->
  <rect width="850" height="140" fill="#080c14" stroke="#1f2937" stroke-width="2" rx="6" />

  <!-- TOP DECORATIVE STRIP -->
  <rect x="0" y="0" width="850" height="4" fill="#00f0ff" />
  <rect x="0" y="4" width="220" height="2" fill="#e10600" />
  <rect x="220" y="4" width="140" height="2" fill="#ffb800" />

  <!-- LEFT TELEMETRY BRACKET -->
  <rect x="24" y="24" width="4" height="92" fill="#00f0ff" />
  <rect x="28" y="24" width="18" height="3" fill="#00f0ff" />
  <rect x="28" y="113" width="18" height="3" fill="#00f0ff" />

  <!-- MAIN NAME & TITLE -->
  <text x="58" y="58" class="retro-title">MARTÍN BERGUER</text>
  <text x="58" y="80" class="retro-sub">STAFF SYSTEMS &amp; SIMULATION ENGINEER</text>
  <text x="58" y="104" class="retro-meta">RUST CONCURRENCY  •  FIA 3504-2019 SIMULATION  •  LOW-LATENCY C++  •  APPLIED ML</text>

  <!-- RIGHT STATUS PILLS (16-BIT RETRO TERMINAL PILLS) -->
  <g transform="translate(630, 26)">
    <!-- Pill 1: SYSTEM READY -->
    <rect x="0" y="0" width="195" height="24" fill="#111827" stroke="#10b981" stroke-width="1.2" />
    <rect x="6" y="7" width="8" height="10" fill="#10b981" />
    <text x="24" y="16" class="retro-meta" fill="#10b981" font-weight="800">STATUS: RACE READY</text>

    <!-- Pill 2: LOCATION -->
    <rect x="0" y="32" width="195" height="24" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <rect x="6" y="39" width="8" height="10" fill="#00f0ff" />
    <text x="24" y="48" class="retro-meta" fill="#cbd5e1">BASE: MONTEVIDEO / REM</text>

    <!-- Pill 3: ENGINE CORE -->
    <rect x="0" y="64" width="195" height="24" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <rect x="6" y="71" width="8" height="10" fill="#e10600" />
    <text x="24" y="80" class="retro-meta" fill="#cbd5e1">CORE: RUST NIGHTLY</text>
  </g>

  <!-- CRT SCANLINES -->
  <rect width="850" height="140" fill="url(#scanlines-head)" pointer-events="none" />
</svg>
